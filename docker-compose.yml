services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        # URL ที่ Browser เรียก Backend (เปลี่ยนตาม env ที่ใช้)
        # local dev  : http://localhost:8008
        # K8s local  : http://api.kuis-award.local
        # ngrok/UAT  : https://your-ngrok.ngrok-free.app
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8008}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-http://localhost:3000}
    image: kuis-frontend:latest
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
