name: Frontend CI/CD

on:
  pull_request:
    branches: [develop, uat, main]
  push:
    branches: [develop, uat, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  lint-and-test:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Lint codebase
        run: npm run lint
        continue-on-error: true

      - name: Type Check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build Next.js (smoke test)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""
          NEXT_PUBLIC_FRONTEND_URL: http://uat-kuis-award.local
          NEXT_PUBLIC_OAUTH_URL: https://example.ngrok-free.app
          NEXT_TELEMETRY_DISABLED: 1

  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag & build-args
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER}/kuis-frontend"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

          BRANCH="${GITHUB_REF#refs/heads/}"
          case "${BRANCH}" in
            main)
              ENV="prod"
              FRONTEND_URL="http://kuis-award.local"
              ;;
            uat)
              ENV="uat"
              FRONTEND_URL="http://uat-kuis-award.local"
              ;;
            *)
              ENV="dev"
              FRONTEND_URL="http://uat-kuis-award.local"
              ;;
          esac
          echo "tag=${ENV}-latest"                >> $GITHUB_OUTPUT
          echo "sha_tag=${ENV}-${GITHUB_SHA::7}"  >> $GITHUB_OUTPUT
          echo "frontend_url=${FRONTEND_URL}"     >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_FRONTEND_URL=${{ steps.meta.outputs.frontend_url }}
            NEXT_PUBLIC_OAUTH_URL=${{ secrets.NGROK_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
