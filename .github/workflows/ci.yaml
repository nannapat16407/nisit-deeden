name: Frontend CI/CD

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kuis-frontend

jobs:
  lint-and-test:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint codebase
        run: npm run lint
        continue-on-error: true

      - name: Type Check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build Next.js (smoke test)
        run: npm run build
        env:
          # URL ที่ Browser ของ User เรียก Backend ผ่าน K8s Ingress
          NEXT_PUBLIC_API_URL: http://api.kuis-award.local
          NEXT_PUBLIC_FRONTEND_URL: http://kuis-award.local
          NEXT_TELEMETRY_DISABLED: 1

  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Push image เฉพาะ push event ไม่ใช่ PR
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment tag
        id: env-tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=uat-latest"      >> $GITHUB_OUTPUT
            echo "sha_tag=uat-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "tag=develop-latest"  >> $GITHUB_OUTPUT
            echo "sha_tag=develop-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (Dockerfile.prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.env-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.env-tag.outputs.sha_tag }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://b41d-158-108-229-42.ngrok-free.app
            NEXT_PUBLIC_FRONTEND_URL=http://kuis-award.local
          cache-from: type=gha
          cache-to: type=gha,mode=max
