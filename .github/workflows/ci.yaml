name: Frontend CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Specify your Next.js project node version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint codebase
        run: npm run lint
        continue-on-error: true # Warning only initially

      - name: Type Check
        run: npx tsc --noEmit
        continue-on-error: true # Keep build running for now even if strict types fail

      - name: Build Next.js
        run: npm run build
        env:
          # Add any required dummy environment variables here for the build to succeed
          NEXT_PUBLIC_API_URL: https://67c9-158-108-229-42.ngrok-free.app
          NEXT_PUBLIC_FRONTEND_URL: http://kuis-award.local
