apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        # LOCAL DEV (imagePullPolicy: Never):
        #   eval $(minikube docker-env)
        #   docker compose build  (หรือ make docker-build-prod)
        #
        # CI/GHCR (imagePullPolicy: Always):
        #   image: ghcr.io/472-68-agiledevops/kuis-frontend:develop-latest
        image: kuis-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        # NEXT_PUBLIC_* ถูก bake เข้า image ตอน build แล้ว ไม่สามารถ override ที่ runtime ได้
        # ต้อง build image ด้วย NEXT_PUBLIC_API_URL=http://api.kuis-award.local
        # ดู Dockerfile.prod และ docker-compose.yml

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: kuis-award.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
